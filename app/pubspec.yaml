name: hash_buddy
description: Find someone to share your airport cab with.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0

  # Voice calls. Audio is peer-to-peer, so no traveller ever learns another's
  # phone number and the server carries only the offer and the answer.
  # 1.x or newer: the 0.12 line compiles against android-31, while its own
  # androidx dependencies require 34+, so the build fails outright.
  flutter_webrtc: ^1.6.0
  # Held at 11.x deliberately. 13.x compiles against android-37, a preview SDK
  # that Gradle cannot even resolve from a normal install, and nothing in this
  # app needs an API newer than 11.x already covers.
  permission_handler: ^11.3.1

  # Push. Chat without it is worse than no chat: the sender believes they made
  # contact when nobody was told. Also carries call invites, which is why
  # signalling needs no websocket.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
