org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# This project lives on D: while the pub cache sits on C:. Kotlin's incremental
# compiler relativises plugin source paths against the project directory and
# throws "this and base files have different roots" when they are on different
# Windows drives. Turning incremental compilation off sidesteps it; the cost is
# slower rebuilds of the plugin modules.
# Alternative fix: move PUB_CACHE onto D: so both share a root.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
